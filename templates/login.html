<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Acceso | Papelería Garaje</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body class="login-page">
    <main class="login-card">
        <div class="brand-badge mb-3"><i class="bi bi-box-seam-fill"></i></div>
        <h1 class="h4 fw-bold mb-1">Papelería Garaje</h1>
        <p class="text-muted mb-4">Ingresa la contraseña de administración</p>
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}<div class="alert alert-danger py-2" role="alert">{{ message }}</div>{% endfor %}
        {% endwith %}
        <form method="post" autocomplete="current-password">
            <label for="password" class="form-label-modern">Contraseña</label>
            <input id="password" name="password" type="password" class="form-control-modern mb-3" required autofocus>
            <button type="submit" class="btn-modern-primary">Entrar</button>
        </form>
    </main>
</body>
</html>
